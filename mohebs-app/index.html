<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOHEBS – Atelier du maître</title>
<meta name="description" content="Fiches de préparation, planification, guides, remédiation, coaching et supports MOHEBS – hors connexion.">
<meta name="theme-color" content="#0f6b45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../fonts.css">
<style>:root{--vert:#0f6b45;--vert2:#13834f;--vertc:#e7f3ec;--or:#e0a526;--encre:#16232e;--gris:#5b6670;--trait:#dfe5e2;--fond:#f4f6f3;--carte:#fff;--rouge:#b3261e;--bleu:#1f4979}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--encre:#e8eee9;--gris:#a9b5ad;--trait:#33423a;--fond:#121815;--carte:#1b231f;--vertc:#1d3328}}
:root[data-theme="dark"]{--encre:#e8eee9;--gris:#a9b5ad;--trait:#33423a;--fond:#121815;--carte:#1b231f;--vertc:#1d3328}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--encre);font:15px/1.45 "Noto Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Bitter,Georgia,serif;margin:0 0 6px}
h2{font-size:1.15rem;color:var(--vert)}
:root[data-theme="dark"] h2{color:#7fd3a4}
button,input,select,textarea{font:inherit;color:inherit}
#bandeau{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#0b5537,#13834f);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#bandeau .logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--vert);display:flex;align-items:center;justify-content:center;font:800 12px Bitter,serif;flex:none}
#bandeau .t{flex:1;min-width:0}
#bandeau .t b{display:block;font:700 1rem Bitter,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bandeau .t small{opacity:.9;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#bandeau select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:5px 6px;max-width:110px}
#bandeau select option{color:#000}
main{padding:12px 12px 120px;max-width:980px;margin:0 auto}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:14px;margin-bottom:12px}
.sous{color:var(--gris);font-size:.9rem;margin:2px 0 8px}
.vide{color:var(--gris);text-align:center;padding:14px 4px}
.champ{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;font-size:.88rem;color:var(--gris)}
.champ input,.champ select,.champ textarea{border:1px solid var(--trait);border-radius:10px;padding:10px;background:var(--carte);color:var(--encre);font-size:1rem;width:100%}
.champ textarea{min-height:70px;resize:vertical}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:420px){.grille2{grid-template-columns:1fr}}
.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 14px;background:var(--vert);color:#fff;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none}
.btn.second{background:var(--carte);color:var(--vert);border:1.5px solid var(--vert)}
.btn.petit{min-height:36px;padding:7px 10px;font-size:.88rem}
.btn.danger{background:var(--carte);color:var(--rouge);border:1.5px solid var(--rouge)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.actions .btn{flex:1 1 140px}
.ligne{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--trait)}
.ligne:first-of-type{border-top:0}
.ligne .g{flex:1;min-width:0}
.ligne .t{font-weight:600}
.ligne .s{color:var(--gris);font-size:.85rem}
.puce{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600;background:var(--vertc);color:var(--vert)}
.puce.ar{background:#f3ead6;color:#8a5a00}
.puce.en{background:#e4e9f5;color:var(--bleu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chips button{flex:none;border:1px solid var(--trait);background:var(--carte);border-radius:999px;padding:7px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--vert);color:#fff;border-color:var(--vert)}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tuile{background:var(--carte);border:1px solid var(--trait);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tuile b{font-family:Bitter,serif;color:var(--vert);font-size:1rem}
.tuile span{color:var(--gris);font-size:.84rem}
#onglets{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--carte);border-top:1px solid var(--trait);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#onglets button{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;color:var(--gris);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#onglets button svg{width:22px;height:22px}
#onglets button[aria-current="page"]{color:var(--vert);background:var(--vertc);font-weight:700}
@media (min-width:900px){#onglets{top:0;bottom:0;right:auto;width:200px;flex-direction:column;padding-top:90px;border-top:0;border-right:1px solid var(--trait)}#onglets button{flex:none;flex-direction:row;gap:10px;font-size:.92rem;padding:12px 14px;justify-content:flex-start}main{margin-left:220px}#bandeau{padding-left:220px}}
.voile{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.panneau{background:var(--fond);width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px 40px}
@media (min-width:700px){.voile{align-items:center}.panneau{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2a24;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{border:1px solid var(--trait);padding:5px 6px;vertical-align:top;text-align:left}
table.t th{background:var(--vertc)}
.planif td[data-act]{cursor:pointer}
.planif td.modif{background:#fff8e1;color:#000}
.phase{border:1px solid var(--trait);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--carte)}
.phase .tete{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.phase .tete input{flex:1}
details.carte summary{cursor:pointer;font-weight:600}
.flash{position:fixed;inset:0;background:#fff;color:#111;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
.flash .item{font:700 min(38vw,40vh)/1 "Noto Sans",Arial,sans-serif;text-align:center;padding:0 4vw;word-break:break-word}
.flash .item.long{font-size:min(12vw,14vh);line-height:1.25}
.flash .barre{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between}
.flash .barre button{border:0;border-radius:10px;padding:10px 14px;background:#0f6b45;color:#fff;font-weight:600}
.flash img{max-width:96vw;max-height:72vh;object-fit:contain}
.flash .leg{font:700 min(8vw,9vh) "Noto Sans",sans-serif;margin-top:2vh;text-align:center}
/* impression */
#impression{background:#888;min-height:100vh;padding:70px 0 30px;position:fixed;inset:0;overflow:auto;z-index:80}
#impression .barre{position:fixed;top:0;left:0;right:0;background:#1d2a24;padding:10px;display:flex;gap:8px;z-index:81}
#impression .feuille{background:#fff;color:#000;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.3);overflow:hidden;font-family:Arial,"Noto Sans",sans-serif}
.feuille.a4{width:210mm;min-height:297mm;padding:10mm}
.feuille.a4l{width:297mm;height:210mm;padding:0;display:flex}
.feuille.a4l .a5{width:148.5mm;height:210mm;padding:7mm;overflow:hidden;border-right:1px dashed #999;position:relative}
.feuille.a4l .a5:last-child{border-right:0}
.feuille.affiche{width:210mm;height:297mm;padding:12mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.feuille.affiche.pay{width:297mm;height:210mm}
.doc table{border-collapse:collapse;width:100%}
.doc td,.doc th{border:1px solid #333;padding:3px 5px;vertical-align:top;font-size:11.5px}
.doc th{background:#e2efda}
.doc .lbl{background:#f2f2f2;font-weight:bold;width:21%}
.pointil{border-bottom:1px dotted #777;height:6mm}
.lignes-ecr div{height:9mm;border-bottom:1px solid #9bb;position:relative}
.lignes-ecr div::before{content:"";position:absolute;left:0;right:0;top:3mm;border-top:1px dotted #cdd}
@media print{
  body{background:#fff}
  body>*:not(#impression){display:none!important}
  #impression{position:static;background:#fff;padding:0;overflow:visible}
  #impression .barre{display:none}
  #impression .feuille{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  #impression .feuille:last-child{page-break-after:auto;break-after:auto}
}
@media screen and (max-width:820px){#impression .feuille{zoom:var(--zoom,.45)}}
.semnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.semnav b{flex:1;text-align:center}.semnav small{color:var(--gris)}
.pastille{display:inline-block;font-size:.7rem;background:var(--or,#c98a00);color:#fff;border-radius:8px;padding:1px 6px;vertical-align:middle}
.seg{display:flex;gap:0;border:1.5px solid var(--vert);border-radius:11px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--carte);color:var(--vert);padding:9px 6px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--vert);color:#fff}
.erreur{color:var(--rouge);min-height:1em}
.panneau table{border-collapse:collapse}
.apercu-a{border:1px solid var(--trait);border-radius:12px;background:#fff;color:#111;padding:14px;text-align:center;overflow:hidden}
.grille-choix{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.grille-choix button{border:1.5px solid var(--trait);background:var(--carte);border-radius:10px;padding:6px;cursor:pointer;color:inherit}
.grille-choix button[aria-pressed="true"]{border-color:var(--vert);box-shadow:0 0 0 2px var(--vert) inset}
.grille-choix img{width:100%;display:block;border-radius:6px}
.recadre{position:relative;display:inline-block;max-width:100%}
.recadre img{max-width:100%;display:block}
.recadre .q{position:absolute;border:2px dashed transparent;cursor:pointer}
.recadre .q[aria-pressed="true"]{border-color:#e8590c;background:rgba(232,89,12,.12)}
.tuile small{color:var(--gris);font-size:.84rem}
</style>
</head>

<div id="classe-plein" hidden></div>
